<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ClimaRD: monitoreo del clima en provincias de la República Dominicana con alertas visuales y mensajes de prevención ante tormentas y huracanes."
    />
    <meta name="theme-color" content="#002d62" />
    <title>ClimaRD · Alerta Ciclónica RD</title>
    <script>
      // Aplica el tema guardado antes de pintar para evitar un destello.
      try {
        var t = JSON.parse(localStorage.getItem('climard-tema'));
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Se reemplaza cuando React arranca. Solo se ve si se abre este archivo con doble clic. -->
      <div style="font-family:system-ui,sans-serif;max-width:560px;margin:15vh auto;padding:0 1rem;text-align:center;color:#0f172a">
        <h1>🌀 ClimaRD</h1>
        <p>Este archivo es el punto de entrada del proyecto y necesita <code>npm run dev</code>.</p>
        <p><a href="./ClimaRD.html" style="display:inline-block;background:#002d62;color:#fff;padding:.8rem 1.4rem;border-radius:8px;text-decoration:none;font-weight:600">Abrir la aplicación (ClimaRD.html)</a></p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
