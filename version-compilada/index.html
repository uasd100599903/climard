<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ClimaRD: monitoreo del clima en provincias de la República Dominicana con alertas visuales y mensajes de prevención ante tormentas y huracanes."
    />
    <meta name="theme-color" content="#002d62" />
    <title>ClimaRD · Alerta Ciclónica RD</title>
    <script>
      // Aplica el tema guardado antes de pintar para evitar un destello.
      try {
        var t = JSON.parse(localStorage.getItem('climard-tema'));
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <link rel="stylesheet" href="./main.css" /><script defer src="./main.js"></script>
  </body>
</html>
